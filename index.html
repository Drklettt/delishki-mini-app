<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Делишки</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: #f4f4f5;

  color: #171717;

}

button,
input {

  font: inherit;

}

.app {

  max-width: 720px;

  margin: auto;

  padding: 16px;

}

.screen {

  display: none;

}

.screen.active {

  display: block;

}

.header {

  padding:
    8px
    4px
    18px;

}

.title {

  font-size: 28px;

  font-weight: 800;

}

.subtitle {

  margin-top: 5px;

  color: #777;

  font-size: 14px;

}

.search {

  width: 100%;

  border: none;

  outline: none;

  background: white;

  border-radius: 15px;

  padding: 14px 16px;

  font-size: 16px;

  margin-bottom: 14px;

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.05);

}

.order {

  background: white;

  border-radius: 18px;

  padding: 17px;

  margin-bottom: 12px;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.06);

  cursor: pointer;

}

.order:active {

  transform: scale(.985);

}

.order-name {

  font-size: 18px;

  font-weight: 750;

  line-height: 1.25;

}

.order-element {

  margin-top: 5px;

  margin-bottom: 13px;

  color: #666;

  font-size: 14px;

}

.tags {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

}

.tag {

  padding:
    6px
    9px;

  border-radius: 9px;

  background: #f0f0f0;

  font-size: 12px;

  color: #555;

}

.progress {

  height: 7px;

  background: #e9e9e9;

  border-radius: 20px;

  overflow: hidden;

  margin-top: 14px;

}

.progress-bar {

  height: 100%;

  background: #111;

  border-radius: 20px;

}

.progress-text {

  margin-top: 6px;

  color: #888;

  font-size: 12px;

}

.loading {

  text-align: center;

  padding: 40px 15px;

  color: #888;

}

.error {

  background: #ffe7e7;

  color: #a40020;

  padding: 16px;

  border-radius: 14px;

  line-height: 1.5;

}

.back {

  border: none;

  background: none;

  padding:
    5px
    0
    15px;

  color: #555;

  font-size: 15px;

}

.card {

  background: white;

  border-radius: 20px;

  padding: 19px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.05);

}

.detail-title {

  font-size: 25px;

  font-weight: 800;

  line-height: 1.2;

}

.detail-element {

  margin-top: 7px;

  color: #666;

}

.section-title {

  font-size: 18px;

  font-weight: 750;

  margin-bottom: 10px;

}

.stage {

  display: flex;

  gap: 12px;

  padding:
    12px
    0;

  border-bottom:
    1px solid #eee;

}

.stage:last-child {

  border-bottom: none;

}

.stage-icon {

  width: 32px;

  height: 32px;

  flex: 0 0 32px;

  border-radius: 50%;

  background: #eee;

  display: flex;

  align-items: center;

  justify-content: center;

}

.stage.done
.stage-icon {

  background: #dff7e6;

}

.stage-name {

  font-weight: 650;

}

.stage-status {

  margin-top: 3px;

  color: #777;

  font-size: 13px;

}

.stage-date {

  margin-top: 4px;

  color: #999;

  font-size: 12px;

}

.file {

  display: flex;

  align-items: center;

  gap: 10px;

  padding:
    12px
    0;

  border-bottom:
    1px solid #eee;

  color: inherit;

  text-decoration: none;

}

.file:last-child {

  border-bottom: none;

}

.file-icon {

  width: 38px;

  height: 38px;

  border-radius: 10px;

  background: #f0f0f0;

  display: flex;

  align-items: center;

  justify-content: center;

}

.file-name {

  flex: 1;

  font-weight: 600;

  font-size: 14px;

}

.file-arrow {

  color: #999;

  font-size: 20px;

}

.history {

  padding:
    12px
    0;

  border-bottom:
    1px solid #eee;

}

.history:last-child {

  border-bottom: none;

}

.history-stage {

  font-weight: 650;

}

.history-change {

  margin-top: 4px;

  color: #555;

  font-size: 13px;

}

.history-date {

  margin-top: 4px;

  color: #999;

  font-size: 12px;

}

.empty {

  text-align: center;

  padding: 30px 10px;

  color: #888;

}

</style>

</head>


<body>


<div class="app">


  <!-- ================================================= -->
  <!-- СПИСОК -->
  <!-- ================================================= -->

  <section
    id="ordersScreen"
    class="screen active"
  >

    <div class="header">

      <div class="title">

        📋 Делишки

      </div>

      <div
        id="userName"
        class="subtitle"
      >

        Загрузка...

      </div>

    </div>


    <input
      id="search"
      class="search"
      placeholder="🔎 Поиск заказа..."
      autocomplete="off"
    >


    <div id="orders">

      <div class="loading">

        Загрузка заказов...

      </div>

    </div>

  </section>


  <!-- ================================================= -->
  <!-- ЗАКАЗ -->
  <!-- ================================================= -->

  <section
    id="detailScreen"
    class="screen"
  >

    <button
      id="backButton"
      class="back"
    >

      ← Назад

    </button>


    <div id="detail">

      <div class="loading">

        Загрузка...

      </div>

    </div>

  </section>


</div>


<script>


// ==========================================================
// TELEGRAM
// ==========================================================

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (tg) {

  tg.ready();

  tg.expand();

}


// ==========================================================
// API
// ==========================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbx4ywzpu8EAX3YtdCFOBgp60iVEVhxfd29QaJAvTee274X8rlZojrMYTSocK08pb-KeMQ/exec';


// ==========================================================
// ДАННЫЕ
// ==========================================================

let orders = [];

let currentOrder = null;


// ==========================================================
// TELEGRAM USER
// ==========================================================

function getTelegramUser() {

  if (!tg) {

    throw new Error(
      'Mini App открыт не внутри Telegram'
    );

  }


  const user =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
      ? tg.initDataUnsafe.user
      : null;


  if (!user) {

    throw new Error(
      'Telegram ID не получен'
    );

  }


  return user;

}


// ==========================================================
// API REQUEST
// ==========================================================

async function api(
  action,
  extra = {}
) {

  const user =
    getTelegramUser();


  const request = {

    action:
      action,

    userId:
      String(user.id),

    ...extra

  };


  const response =
    await fetch(

      API_URL,

      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            request
          )

      }

    );


  const result =
    await response.json();


  if (!result.ok) {

    throw new Error(
      result.error ||
      'Ошибка API'
    );

  }


  return result;

}


// ==========================================================
// ПРОГРЕСС
// ==========================================================

function getProgress(order) {

  if (
    order &&
    order.progress &&
    typeof order.progress.percent !==
      'undefined'
  ) {

    return {

      completed:
        Number(
          order.progress.completed
        ) || 0,

      total:
        Number(
          order.progress.total
        ) || 0,

      percent:
        Number(
          order.progress.percent
        ) || 0

    };

  }


  const statuses =
    order &&
    Array.isArray(order.statuses)
      ? order.statuses
      : [];


  const trackable =
    statuses.filter(
      function(status) {

        return (
          status &&
          status.trackable === true
        );

      }
    );


  const completed =
    trackable.filter(
      function(status) {

        return (
          status &&
          status.completed === true
        );

      }
    );


  const total =
    trackable.length;


  const percent =
    total > 0

      ? Math.round(
          completed.length /
          total *
          100
        )

      : 0;


  return {

    completed:
      completed.length,

    total:
      total,

    percent:
      percent

  };

}


// ==========================================================
// ЗАПУСК
// ==========================================================

async function start() {

  try {

    const user =
      getTelegramUser();


    document
      .getElementById(
        'userName'
      )
      .textContent =
      '👋 ' +
      (
        user.first_name ||
        user.username ||
        'Пользователь'
      );


    await api(
      'test'
    );


    const result =
      await api(
        'getOrders'
      );


    orders =
      Array.isArray(
        result.orders
      )
        ? result.orders
        : [];


    renderOrders();


  } catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        'orders'
      )
      .innerHTML = `

        <div class="error">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

  }

}


// ==========================================================
// СПИСОК ЗАКАЗОВ
// ==========================================================

function renderOrders() {

  const container =
    document
      .getElementById(
        'orders'
      );


  const search =
    document
      .getElementById(
        'search'
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    orders.filter(
      function(order) {

        const text =

          String(
            order.order || ''
          ) +

          ' ' +

          String(
            order.element || ''
          ) +

          ' ' +

          String(
            order.type || ''
          );


        return text
          .toLowerCase()
          .includes(
            search
          );

      }
    );


  if (
    filtered.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        Заказы не найдены

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(
        function(order) {

          const progress =
            getProgress(
              order
            );


          return `

            <div
              class="order"
              data-row="${Number(
                order.row
              )}"
            >

              <div class="order-name">

                ${escapeHtml(
                  order.order || ''
                )}

              </div>


              <div class="order-element">

                ${escapeHtml(
                  order.element || ''
                )}

              </div>


              <div class="tags">

                ${
                  order.type
                    ? `

                      <div class="tag">

                        🏷
                        ${escapeHtml(
                          order.type
                        )}

                      </div>

                    `
                    : ''
                }


                ${
                  order.installDate
                    ? `

                      <div class="tag">

                        📅
                        ${escapeHtml(
                          order.installDate
                        )}

                      </div>

                    `
                    : ''
                }


                <div class="tag">

                  📊
                  ${progress.percent}%

                </div>

              </div>


              <div class="progress">

                <div
                  class="progress-bar"
                  style="width:${progress.percent}%"
                ></div>

              </div>


              <div class="progress-text">

                ${progress.completed}
                из
                ${progress.total}
                этапов

              </div>

            </div>

          `;

        }
      )
      .join('');


  container
    .querySelectorAll(
      '.order'
    )
    .forEach(
      function(element) {

        element.addEventListener(
          'click',
          function() {

            openOrder(
              Number(
                element.dataset.row
              )
            );

          }
        );

      }
    );

}


// ==========================================================
// ОТКРЫТЬ ЗАКАЗ
// ==========================================================

async function openOrder(
  row
) {

  document
    .getElementById(
      'ordersScreen'
    )
    .classList
    .remove('active');


  document
    .getElementById(
      'detailScreen'
    )
    .classList
    .add('active');


  document
    .getElementById(
      'detail'
    )
    .innerHTML = `

      <div class="loading">

        Загрузка заказа...

      </div>

    `;


  try {

    const result =
      await api(
        'getOrder',
        {
          row:
            row
        }
      );


    currentOrder =
      result.order;


    renderOrder(
      currentOrder
    );


  } catch (error) {

    document
      .getElementById(
        'detail'
      )
      .innerHTML = `

        <div class="error">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

  }

}


// ==========================================================
// ЗАКАЗ
// ==========================================================

function renderOrder(
  order
) {

  const detail =
    document
      .getElementById(
        'detail'
      );


  const progress =
    getProgress(
      order
    );


  // --------------------------------------------------------
  // СТАТУСЫ
  // --------------------------------------------------------

  const statuses =
    Array.isArray(
      order.statuses
    )
      ? order.statuses
      : [];


  let stagesHtml = '';


  if (
    statuses.length > 0
  ) {

    stagesHtml =
      statuses
        .map(
          function(stage) {

            const done =
              stage &&
              stage.completed === true;


            return `

              <div
                class="stage ${
                  done
                    ? 'done'
                    : ''
                }"
              >

                <div class="stage-icon">

                  ${
                    done
                      ? '✓'
                      : '○'
                  }

                </div>


                <div>

                  <div class="stage-name">

                    ${escapeHtml(
                      stage.name || ''
                    )}

                  </div>


                  <div class="stage-status">

                    ${done
                      ? 'Готово'
                      : 'Не выполнено'
                    }

                  </div>


                  ${
                    stage.changedAt
                      ? `

                        <div class="stage-date">

                          Последнее изменение:
                          ${escapeHtml(
                            stage.changedAt
                          )}

                        </div>

                      `
                      : ''
                  }

                </div>

              </div>

            `;

          }
        )
        .join('');

  } else {

    stagesHtml = `

      <div class="empty">

        Этапы отсутствуют

      </div>

    `;

  }


  // --------------------------------------------------------
  // ФАЙЛЫ
  // --------------------------------------------------------

  const files =
    Array.isArray(
      order.files
    )
      ? order.files
      : [];


  let filesHtml = '';


  if (
    files.length > 0
  ) {

    filesHtml =
      files
        .map(
          function(file) {

            return `

              <a
                class="file"
                href="${escapeAttribute(
                  file.url || '#'
                )}"
                target="_blank"
                rel="noopener"
              >

                <div class="file-icon">

                  📎

                </div>


                <div class="file-name">

                  ${escapeHtml(
                    file.name || 'Файл'
                  )}

                </div>


                <div class="file-arrow">

                  ›

                </div>

              </a>

            `;

          }
        )
        .join('');

  } else {

    filesHtml = `

      <div class="empty">

        Файлов нет

      </div>

    `;

  }


  // --------------------------------------------------------
  // ИСТОРИЯ
  // --------------------------------------------------------

  const history =
    Array.isArray(
      order.history
    )
      ? order.history
      : [];


  let historyHtml = '';


  if (
    history.length > 0
  ) {

    historyHtml =
      history
        .map(
          function(item) {

            return `

              <div class="history">

                <div class="history-stage">

                  ${escapeHtml(
                    item.stage || ''
                  )}

                </div>


                <div class="history-change">

                  ${
                    escapeHtml(
                      item.oldValue || '—'
                    )
                  }

                  →

                  ${
                    escapeHtml(
                      item.newValue || '—'
                    )
                  }

                </div>


                <div class="history-date">

                  ${escapeHtml(
                    item.date || ''
                  )}

                </div>

              </div>

            `;

          }
        )
        .join('');

  } else {

    historyHtml = `

      <div class="empty">

        История пока пустая

      </div>

    `;

  }


  // --------------------------------------------------------
  // HTML
  // --------------------------------------------------------

  detail.innerHTML = `

    <div class="card">

      <div class="detail-title">

        ${escapeHtml(
          order.order || ''
        )}

      </div>


      <div class="detail-element">

        ${escapeHtml(
          order.element || ''
        )}

      </div>


      <div class="tags">

        ${
          order.type
            ? `

              <div class="tag">

                🏷
                ${escapeHtml(
                  order.type
                )}

              </div>

            `
            : ''
        }


        ${
          order.installDate
            ? `

              <div class="tag">

                📅
                ${escapeHtml(
                  order.installDate
                )}

              </div>

            `
            : ''
        }


        <div class="tag">

          📊
          ${progress.percent}% готово

        </div>

      </div>

    </div>


    <div class="card">

      <div class="section-title">

        📋 Состояние заказа

      </div>


      ${stagesHtml}

    </div>


    <div class="card">

      <div class="section-title">

        📁 Файлы

      </div>


      ${filesHtml}

    </div>


    <div class="card">

      <div class="section-title">

        🕐 История изменений

      </div>


      ${historyHtml}

    </div>

  `;

}


// ==========================================================
// НАЗАД
// ==========================================================

document
  .getElementById(
    'backButton'
  )
  .addEventListener(
    'click',
    function() {

      document
        .getElementById(
          'detailScreen'
        )
        .classList
        .remove('active');


      document
        .getElementById(
          'ordersScreen'
        )
        .classList
        .add('active');

    }
  );


// ==========================================================
// ПОИСК
// ==========================================================

document
  .getElementById(
    'search'
  )
  .addEventListener(
    'input',
    function() {

      renderOrders();

    }
  );


// ==========================================================
// HTML ESCAPE
// ==========================================================

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


// ==========================================================
// START
// ==========================================================

start();

</script>

</body>

</html>
