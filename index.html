<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Telegram Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div id="result" style="
  font-family: Arial;
  padding: 20px;
  font-size: 18px;
  line-height: 1.6;
">
  Проверяем Telegram...
</div>


<script>

const result =
  document.getElementById('result');


const tg =
  window.Telegram.WebApp;


tg.ready();


let html = '';


// ------------------------------------------------
// Проверяем Telegram WebApp
// ------------------------------------------------

html +=
  '<b>Telegram WebApp:</b> ' +
  (
    window.Telegram &&
    window.Telegram.WebApp
      ? 'ЕСТЬ'
      : 'НЕТ'
  ) +
  '<br><br>';


// ------------------------------------------------
// Проверяем initData
// ------------------------------------------------

html +=
  '<b>initData:</b> ' +
  (
    tg.initData
      ? 'ЕСТЬ'
      : 'ПУСТО'
  ) +
  '<br><br>';


// ------------------------------------------------
// Проверяем initDataUnsafe
// ------------------------------------------------

html +=
  '<b>initDataUnsafe:</b> ' +
  (
    tg.initDataUnsafe
      ? 'ЕСТЬ'
      : 'НЕТ'
  ) +
  '<br><br>';


// ------------------------------------------------
// Проверяем user
// ------------------------------------------------

const user =
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user;


html +=
  '<b>user:</b> ' +
  (
    user
      ? 'ЕСТЬ'
      : 'НЕТ'
  ) +
  '<br><br>';


// ------------------------------------------------
// ID
// ------------------------------------------------

if (
  user &&
  user.id
) {

  html +=
    '<b>Telegram ID:</b> ' +
    user.id;

} else {

  html +=
    '<b style="color:red">' +
    '❌ Telegram ID НЕ получен' +
    '</b>';

}


result.innerHTML =
  html;

</script>

</body>

</html>
